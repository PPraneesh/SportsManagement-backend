spring.application.name=competition-service
server.port=8084

# ==============================
# MySQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/competition_db
spring.datasource.username=root
spring.datasource.password=96321
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT
# ==============================

jwt.secret=rsdXhhgtN/3eiyHyMEcRtngQmshXcmAXIJqzW+rDoXo=
jwt.expiration-ms=36000000
jwt.issuer=sports-tournament-system

# ==============================
# Services
# ==============================

services.team.url=http://localhost:8081
services.tournament.url=http://localhost:8082

# ==============================
# Kafka
# ==============================

spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=competition-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.praneesh.sports.competition_service.dto.event.TournamentRegistrationClosedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.praneesh.sports.competition_service.dto.event

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

logging.level.com.praneesh.sports = info
logging.level.org.springframework.security = DEBUG