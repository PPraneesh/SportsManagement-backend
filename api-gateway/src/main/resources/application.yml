server:
  port: 8080

jwt:
  secret: rsdXhhgtN/3eiyHyMEcRtngQmshXcmAXIJqzW+rDoXo=
  expiration-ms: 36000000
  issuer: sports-tournament-system

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            # =========================
            # USER SERVICE
            # =========================
            - id: user-teams-tournaments
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/me/teams

            #=================
            - id: user-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/users/**

            # =========================
            # TEAM SERVICE
            # =========================

            # /api/tournaments/{id}/teams/**
            - id: team-service-tournament-teams
              uri: http://localhost:8081
              predicates:
                - Path=/api/tournaments/*/teams/**

            # /api/tournaments/{id}/invitations/**
            - id: team-service-tournament-invitations
              uri: http://localhost:8081
              predicates:
                - Path=/api/tournaments/*/invitations/**

            # /api/teams/**
            - id: team-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/teams/**

            # /api/invitations/**
            - id: team-service-invitations
              uri: http://localhost:8081
              predicates:
                - Path=/api/invitations/**

            - id: competition-public
              uri: http://localhost:8084
              predicates:
                - Path=/api/public/**

            - id: competition-matches
              uri: http://localhost:8084
              predicates:
                - Path=/api/matches/**

            - id: competition-tournament-matches
              uri: http://localhost:8084
              predicates:
                - Path=/api/tournaments/*/matches
            # =========================
            # TOURNAMENT SERVICE
            # =========================
            - id: tournament-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/tournaments/**
logging:
  file:
    name: ${LOG_PATH:../logs}/api-gateway.log
  level:
    root: info
    com.praneesh.sports: debug
    org.springframework.security: debug

